name: Validate theme
on: [push, pull_request]
permissions:
  contents: read
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate palette and distributable assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, struct, tomllib
          root = Path('.')
          colors = tomllib.loads(Path('colors.toml').read_text())
          tomllib.loads(Path('shell.toml').read_text())
          assert colors['mode'] == 'dark'
          keys = 'accent background foreground selection muted red green yellow blue magenta cyan'.split()
          assert all(re.fullmatch(r'#[0-9a-fA-F]{6}', colors[k]) for k in keys)
          def luminance(hex):
              rgb = [int(hex[i:i+2], 16) / 255 for i in (1, 3, 5)]
              return sum(w * (c/12.92 if c <= .04045 else ((c+.055)/1.055)**2.4) for w, c in zip((.2126, .7152, .0722), rgb))
          bg = luminance(colors['background'])
          for key in 'foreground accent muted red green yellow blue magenta cyan'.split():
              lo, hi = sorted((bg, luminance(colors[key])))
              assert (hi+.05)/(lo+.05) >= 4.5, key
          for p in root.rglob('*'):
              if '.git' in p.parts:
                  continue
              assert not p.is_symlink(), p
              if p.suffix == '.png':
                  data = p.read_bytes()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n', p
                  size = struct.unpack('>II', data[16:24])
                  if p.parent.name == 'backgrounds':
                      assert size == (3840, 2400), (p, size)
                  if p.name.startswith('preview'):
                      assert size == (1920, 1080), (p, size)
              assert p.suffix not in ('.lua', '.sh'), p
          print('Theme palette, contrast and assets validated.')
          PY
